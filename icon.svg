<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Cyber Blue to Dark Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Metallic Glass Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Tab 1 Gradient (Top / Hero Active Tab) -->
    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>

    <!-- Tab 2 Gradient (Cyan / Ocean Blue Glow) -->
    <linearGradient id="tab2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Tab 3 Gradient (Vibrant Violet / Magenta) -->
    <linearGradient id="tab3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Category Dot Gradients -->
    <linearGradient id="dotBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="shadowMedium" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container (Squircle App Icon Base) -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Rim / Glass Highlight -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="url(#glassBorder)" stroke-width="1.8"/>

  <!-- Ambient Glow Effects -->
  <circle cx="28" cy="28" r="32" fill="#3b82f6" opacity="0.15" filter="blur(12px)"/>
  <circle cx="100" cy="100" r="35" fill="#a855f7" opacity="0.15" filter="blur(14px)"/>

  <!-- ── STACKED ACCORDION TABS (Representing Organized Domain / Category Groups) ── -->

  <!-- TAB 3 (Back Layer - Purple Group) -->
  <g opacity="0.75" transform="translate(0, 0)">
    <path d="M 16,28 L 44,28 C 47,28 49,34 52,34 L 106,34 C 110,34 112,28 112,28" fill="url(#tab3Grad)"/>
    <rect x="16" y="32" width="96" height="30" rx="7" fill="url(#tab3Grad)"/>
    <circle cx="27" cy="47" r="4" fill="#ffffff" opacity="0.9"/>
    <rect x="36" y="44" width="28" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- TAB 2 (Middle Layer - Cyan Group) -->
  <g opacity="0.9" filter="url(#shadowMedium)">
    <path d="M 16,46 L 48,46 C 51,46 54,52 57,52 L 106,52 C 110,52 112,46 112,46" fill="url(#tab2Grad)"/>
    <rect x="16" y="50" width="96" height="34" rx="7" fill="url(#tab2Grad)"/>
    <circle cx="27" cy="67" r="4" fill="#ffffff"/>
    <rect x="36" y="64" width="34" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- TAB 1 (Front Layer - Main Active / Sorted Focus Tab) -->
  <g filter="url(#shadowHeavy)">
    <!-- Tab Ear / Top Header Shape -->
    <path d="M 16,64 L 52,64 C 55,64 58,70 62,70 L 106,70 C 110,70 112,64 112,64" fill="url(#activeTabGrad)"/>
    <!-- Main Body -->
    <rect x="16" y="68" width="96" height="42" rx="8" fill="url(#activeTabGrad)"/>

    <!-- Tab UI Content Elements -->
    <!-- Favicon Icon Badge -->
    <circle cx="29" cy="89" r="6" fill="url(#dotBlue)"/>
    
    <!-- Tab Title Bar -->
    <rect x="42" y="83" width="40" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="42" y="91" width="26" height="4" rx="2" fill="#64748b"/>

    <!-- Window Control Dot Indicators (Tab action icons) -->
    <circle cx="94" cy="89" r="3" fill="#cbd5e1"/>
    <path d="M 100,86 L 104,90 M 104,86 L 100,90" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
