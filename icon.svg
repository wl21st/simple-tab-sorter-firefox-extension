<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="background" x1="18" y1="12" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D5DFB"/>
      <stop offset="1" stop-color="#3B28CC"/>
    </linearGradient>
    <linearGradient id="accent" x1="24" y1="67" x2="81" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39E6D0"/>
      <stop offset="1" stop-color="#16B8D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#21147B" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- High-contrast tile remains recognizable in light and dark browser chrome. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#background)"/>
  <path d="M22 22c19-15 64-15 84 5" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="8" stroke-linecap="round"/>

  <!-- Three offset browser tabs form a clear stack even at 16 px. -->
  <g filter="url(#shadow)">
    <path d="M30 27h31l8 9h31a8 8 0 0 1 8 8v32H30a8 8 0 0 1-8-8V35a8 8 0 0 1 8-8Z" fill="#AFA6FF" opacity=".62"/>
    <circle cx="39" cy="48" r="5" fill="#39E6D0" opacity=".9"/>
    <path d="M23 45h32l8 9h37a8 8 0 0 1 8 8v30H23a8 8 0 0 1-8-8V53a8 8 0 0 1 8-8Z" fill="#D7D2FF" opacity=".9"/>
    <circle cx="32" cy="66" r="5" fill="#FFB84D"/>
    <path d="M22 64h35l8 9h35a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8V72a8 8 0 0 1 8-8Z" fill="#fff"/>
  </g>

  <!-- Accent details suggest a tab row without depending on fine text-like lines. -->
  <circle cx="31" cy="89" r="7" fill="url(#accent)"/>
  <rect x="44" y="84" width="38" height="10" rx="5" fill="#7767EE"/>
  <circle cx="94" cy="89" r="5" fill="#FFB84D"/>
</svg>
